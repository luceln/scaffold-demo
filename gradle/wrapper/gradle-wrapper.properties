distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 发行包默认走腾讯镜像 all 包（国内直连；all = bin+src+docs，IDE 索引不再另行
# 拉官方 src）。缓存键 = distributionUrl 整串，全项目统一用这一个 URL 才能共享缓存。
# 海外/CI 如需官方源：换回 bin 包并恢复校验
#   distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
#   distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.7.1-all.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
