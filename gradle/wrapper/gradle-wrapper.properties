distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 发行包走腾讯镜像（all 包：bin+src+docs，IDE 索引不再另行拉官方 src）。
# all 包字节与官方 bin 不同，故不保留 distributionSha256Sum（换镜像时校验基线随之失效）。
