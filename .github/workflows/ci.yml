name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    # ubuntu runner 预装 Android SDK，无需额外安装步骤
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v5

      # 单一入口：与本地预检同一条命令。check 自动聚合 spotlessCheck /
      # lint / testDevDebugUnitTest / testProdDebugUnitTest（AGP 已把它们挂进 check），
      # 不要在这里罗列任务清单 —— 任务集合不同＝本地与 CI 的等价性是假的。
      # 注意：带 flavor 后"按构建类型命名"的聚合任务（lintDebug、testDebugUnitTest）
      # 已不存在，`check` 才是稳定的入口。
      - name: 检查与构建
        run: |
          ./gradlew --console=plain --no-daemon check assembleDebug

      # 编译产物上传：run 页 Summary 底部 Artifacts 区下载（保留 90 天，需登录 GitHub）
      # ⚠️ 路径带 flavor：产物落在 apk/<flavor>/debug/ 下，不再是 apk/debug/。
      # 用通配一次收齐 dev 与 prod 两个包（少一个都会让 if-no-files-found 报错）。
      - name: 上传 debug APK（dev + prod）
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
